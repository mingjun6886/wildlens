[project]
name = "wildlens"
version = "0.1.0"
description = "Serverless wildlife image tagging on AWS"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,W pycodestyle · F pyflakes · I import sorting · B bugbear
# C4 comprehensions · UP pyupgrade · S bandit (security) · T20 no stray print()
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "T20"]
ignore = ["E501"]  # line length is the formatter's concern, not the linter's

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and throwaway credentials in fixtures (S105/S106).
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "services"]
addopts = "-v --strict-markers"
markers = [
  "integration: talks to real AWS; skipped unless AWS_PROFILE is set",
]
