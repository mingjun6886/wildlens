# A read-only `terraform plan` on pull requests that change infrastructure.
#
# It assumes a role that can read, but not write, the account and the state, so
# the worst a malicious workflow edit can do is read resource metadata. See
# modules/ci for the trust condition and the deny statements. Nothing in CI ever
# applies.
name: plan

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/plan.yml

permissions: {}

jobs:
  plan:
    # Pull requests from forks are not issued an OIDC token, so the job would
    # fail at sign-in with a confusing message. Skipping it says why.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
    steps:
      - name: Require the role variable
        run: |
          if [ -z "$PLAN_ROLE_ARN" ]; then
            echo "::error::Repository variable AWS_PLAN_ROLE_ARN is not set. See docs/runbook.md, 'Bootstrapping CI'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.x
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Init
        run: terraform init -input=false
        working-directory: infra/terraform/envs/dev

      - name: Plan
        # -lock=false: the role cannot write the lock file, by design.
        #
        # The exit status is captured and re-raised rather than piped through
        # tee: the default shell has no pipefail, so `plan | tee` would report
        # success for a failed plan. Capturing it also means the summary is
        # written when the plan fails, which is when it is most wanted.
        run: |
          set +e
          terraform plan -lock=false -input=false -no-color > plan.txt 2>&1
          status=$?
          cat plan.txt
          {
            echo '## terraform plan'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        working-directory: infra/terraform/envs/dev
