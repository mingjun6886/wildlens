# Ground truth for the 26-image test set.
#
# Species come from the filename: the source dataset names each image after the
# species it contains. Counts are not in the filename and were established by
# viewing every image.
#
# Counting rule: an individual is counted when it is identifiable at normal
# viewing scale. Animals that only become visible when zooming in are excluded,
# because the key should describe what a good system ought to find, not what a
# careful human can eventually locate.
#
# Note on "dingo": labels.txt maps both Canis_familiaris and Canis_dingo to the
# common name "dingo", so either predicted class satisfies these entries. One of
# the two images is plainly a collared domestic dog; the tag vocabulary has no
# way to express that distinction, which is a property of the label set rather
# than of the model.
#
# Every count was reviewed against the image. The two cattle frames are marked
# CLOSE RANGE: the herd overlaps and extends past the frame edge, so those two
# counts carry more uncertainty than the rest. Between them they contribute 8 of
# the 32 individuals in this key, so cattle recall should be read with that in
# mind rather than taken at face value.

Alectura_lathami_1.JPG:
  australian brushturkey: 1
Alectura_lathami_2.JPG:
  australian brushturkey: 1

# CLOSE RANGE: a herd, partly overlapping and partly out of frame.
Bos_taurus_1.JPG:
  cattle: 4
# CLOSE RANGE: the camera is close enough that only legs and flanks are visible.
Bos_taurus_2.JPG:
  cattle: 4

